name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out deepseek-harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Move plugin into the harness workspace
        run: |
          mkdir -p harness/dsh-plugins
          mv plugin harness/dsh-plugins/dsh-ui-conversation-fold
          sed -i '/^linkWorkspacePackages:/i\  - dsh-plugins/*' harness/pnpm-workspace.yaml

      - name: Install harness workspace
        working-directory: harness
        run: pnpm install --no-frozen-lockfile

      - name: Build harness host libs
        working-directory: harness
        run: pnpm run build:lib:host

      - name: Build harness client libs
        working-directory: harness
        run: pnpm run build:lib:client

      - name: Build plugin
        working-directory: harness
        run: pnpm --filter dsh-ui-conversation-fold run build

      - name: Pack plugin tarball
        working-directory: harness/dsh-plugins/dsh-ui-conversation-fold
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: harness/dsh-plugins/dsh-ui-conversation-fold/dist/dsh-ui-conversation-fold-*.tgz
